<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner calendar & task card -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#cardGrad)" />
    
    <!-- Top banner bar -->
    <rect x="96" y="96" width="320" height="88" rx="36" fill="#1e293b" />
    <rect x="96" y="148" width="320" height="36" fill="#1e293b" />

    <!-- Calendar binders / pins -->
    <rect x="156" y="74" width="28" height="44" rx="14" fill="#38bdf8" />
    <rect x="328" y="74" width="28" height="44" rx="14" fill="#38bdf8" />

    <!-- Clock / Timeline icon indicator in banner -->
    <circle cx="256" cy="140" r="18" fill="none" stroke="#38bdf8" stroke-width="4" />
    <polyline points="256,128 256,140 266,144" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Scheduled task rows -->
    <!-- Task Row 1: completed check -->
    <circle cx="148" cy="232" r="16" fill="#10b981" />
    <polyline points="140,232 146,238 156,226" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="180" y="222" width="160" height="12" rx="6" fill="#94a3b8" />
    <rect x="180" y="240" width="80" height="8" rx="4" fill="#cbd5e1" />

    <!-- Task Row 2: active task with pin notification highlight -->
    <circle cx="148" cy="296" r="16" fill="#2563eb" />
    <circle cx="148" cy="296" r="6" fill="#ffffff" />
    <rect x="180" y="286" width="190" height="14" rx="7" fill="#1e293b" />
    <rect x="180" y="306" width="110" height="9" rx="4.5" fill="#38bdf8" />

    <!-- Task Row 3: queued task -->
    <circle cx="148" cy="358" r="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="180" y="350" width="140" height="12" rx="6" fill="#64748b" />
    <rect x="180" y="368" width="70" height="8" rx="4" fill="#cbd5e1" />
  </g>

  <!-- Android notification pin badge accent on bottom-right -->
  <circle cx="390" cy="390" r="42" fill="#0284c7" stroke="#ffffff" stroke-width="6" />
  <path d="M390 368 C382 368 376 374 376 382 C376 394 371 398 368 400 L412 400 C409 398 404 394 404 382 C404 374 398 368 390 368 Z" fill="#ffffff" />
  <circle cx="390" cy="406" r="4" fill="#ffffff" />
</svg>
