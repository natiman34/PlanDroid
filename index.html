<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PlanDroid - Offline Smart Task Planner & Notification Scheduler</title>
    <meta name="description" content="An offline-first Android task planner and scheduler that automatically optimizes your daily work schedule and pins real-time interactive plans into your phone notification bar." />
    
    <!-- OpenGraph / Social -->
    <meta property="og:title" content="PlanDroid - Offline Smart Task Planner & Notification Scheduler" />
    <meta property="og:description" content="An offline-first Android task planner and scheduler that automatically optimizes your daily work schedule and pins real-time interactive plans into your phone notification bar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Android PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlanDroid" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Inter Google Font Preload for crisp typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Noto Sans Ethiopic';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/noto-sans-ethiopic.woff2') format('woff2');
      }
      body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', 'Abyssinica SIL', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('plandroid_notification_settings_v3');
          var parsed = raw ? JSON.parse(raw) : null;
          var pref = (parsed && parsed.theme) || 'dark';
          var isLight = pref === 'light' || (pref === 'system' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isLight) {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f1f5f9');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen overflow-x-hidden font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
